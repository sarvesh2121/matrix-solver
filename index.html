<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matrix Solver | Sarvesh Borade</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header>
        <h1>🧮 Matrix Solver</h1>
        <p>Fast • Accurate • Easy Matrix Calculations</p>
    </header>


    <!-- OPERATIONS -->
    <section class="operations">

        <h2>Select Operation</h2>

        <div class="operation-buttons">

            <button onclick="setOperation('determinant')">
                Determinant
            </button>

            <button onclick="setOperation('inverse')">
                Inverse
            </button>

            <button onclick="setOperation('square')">
                Matrix Square
            </button>

            <button onclick="setOperation('transpose')">
                Transpose
            </button>

            <button onclick="setOperation('addition')">
                Addition
            </button>

            <button onclick="setOperation('subtraction')">
                Subtraction
            </button>

            <button onclick="setOperation('multiplication')">
                Multiplication
            </button>

        </div>

    </section>


    <!-- MATRIX A -->
    <section class="matrix-section">

        <h2>Matrix A</h2>

        <div class="matrix-size">

            <label for="rowsA">Rows:</label>

            <select id="rowsA">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>


            <label for="colsA">Columns:</label>

            <select id="colsA">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>


            <button onclick="createMatrixA()">
                Generate Matrix
            </button>

        </div>


        <div id="matrixA" class="matrix-container"></div>

    </section>



    <!-- MATRIX B -->
    <section class="matrix-section" id="matrixBSection">

        <h2>Matrix B</h2>

        <div class="matrix-size">

            <label for="rowsB">Rows:</label>

            <select id="rowsB">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>


            <label for="colsB">Columns:</label>

            <select id="colsB">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>


            <button onclick="createMatrixB()">
                Generate Matrix B
            </button>

        </div>


        <div id="matrixB" class="matrix-container"></div>

    </section>



    <!-- SOLVE BUTTON -->
    <section class="solve-section">

        <button class="solve-button" onclick="solveMatrix()">
            ⚡ Calculate
        </button>

    </section>



    <!-- RESULT -->
    <section class="result-section">

        <h2>Result</h2>

        <div id="result">

            <h3>Your result will appear here</h3>

            <p>
                Enter a matrix and select an operation above.
            </p>

        </div>

    </section>



    <!-- FOOTER -->
    <footer>

        <p>
            🧮 Matrix Solver
        </p>

        <span>
            Built for students • Fast • Accurate • Easy
        </span>

        <p class="creator">
            Generated by: <strong>Sarvesh Borade</strong>
            <br>
            Class: <strong>FYME-Prithvi</strong>
        </p>

    </footer>

</div>


<!-- JAVASCRIPT -->
<script src="script.js"></script>

</body>
</html>
